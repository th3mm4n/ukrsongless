<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Впізнай пісню · UA</title>
<style>
:root{
  --bg:#0c1424; --panel:#14203a; --line:#25365a; --text:#eef2fb; --muted:#8b9bbd;
  --blue:#2f6fe4; --yellow:#ffd23f; --good:#3ecf8e; --bad:#ef5b5b;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;justify-content:center;padding:20px 14px 60px}
.app{width:100%;max-width:520px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:20px;margin:0;letter-spacing:.2px}
h1 span{display:inline-block;width:18px;height:12px;vertical-align:-1px;margin-right:8px;border-radius:2px;background:linear-gradient(var(--blue) 50%,var(--yellow) 50%)}
.tabs{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{background:none;border:0;color:var(--muted);padding:7px 12px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}
.tabs button.on{background:var(--blue);color:#fff}
.langs{display:flex;justify-content:flex-end;margin:-8px 0 14px}
.langs .tabs button{padding:4px 10px;font-size:12px}
.streak{font-size:13px;margin-top:8px!important}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.player{display:flex;align-items:center;gap:14px}
#play{flex:none;width:64px;height:64px;border-radius:50%;border:0;background:var(--yellow);color:#14203a;font-size:24px;cursor:pointer;display:grid;place-items:center}
#play:disabled{opacity:.45;cursor:default}
#play:active:not(:disabled){transform:scale(.96)}
.bar{flex:1}
.track{position:relative;display:flex;gap:3px;height:14px}
.seg{flex:none;height:100%;background:#0c1424;border-radius:3px;border:1px solid var(--line)}
.seg.on{background:#2a4a8c;border-color:#2a4a8c}
.head{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--yellow);border-radius:2px;left:0;display:none}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:8px}
.status{min-height:18px;margin:10px 0 0;font-size:13px;color:var(--muted)}
.status.err{color:var(--bad)}
.slots{display:grid;gap:6px;margin:16px 0}
.slot{height:38px;border:1px solid var(--line);border-radius:9px;padding:0 12px;display:flex;align-items:center;font-size:14px;color:var(--muted);background:rgba(12,20,36,.5);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.cur{border-color:var(--blue);color:var(--text)}
.slot.wrong{color:var(--text);border-color:#5a2a35;background:rgba(239,91,91,.1)}
.slot.skip{color:var(--muted);border-style:dashed}
.slot.right{color:var(--text);border-color:#1d6b4d;background:rgba(62,207,142,.12)}
.slot.artist{color:var(--text);border-color:#8a7419;background:rgba(255,210,63,.18)}
.guess{position:relative}
.guess input{width:100%;height:46px;border-radius:10px;border:1px solid var(--line);background:#0c1424;color:var(--text);padding:0 14px;font:inherit;font-size:15px;outline:none}
.guess input:focus{border-color:var(--blue)}
.list{position:absolute;left:0;right:0;bottom:calc(100% + 6px);background:#0f1a31;border:1px solid var(--line);border-radius:10px;max-height:260px;overflow:auto;display:none;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.list div{padding:10px 14px;font-size:14px;cursor:pointer;border-bottom:1px solid #1b2a49}
.list div:last-child{border-bottom:0}
.list div small{color:var(--muted);margin-left:6px}
.list div.hi,.list div:hover{background:#1c2f59}
.row{display:flex;gap:10px;margin-top:10px}
.btn{flex:1;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit;font-size:14px;cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.result{display:none;text-align:center}
.result h2{margin:2px 0 4px;font-size:22px}
.result p{margin:2px 0;color:var(--muted)}
.result .song{color:var(--text);font-size:17px;margin:10px 0 2px}
.result a{color:var(--yellow)}
/* SoundCloud widget: present but invisible during the round (it shows the title), expanded on reveal */
.scbox{height:0;overflow:hidden;opacity:0;pointer-events:none}
.scbox.show{height:166px;opacity:1;pointer-events:auto;margin-bottom:12px;border-radius:12px}
.scbox iframe{display:block;width:100%;height:166px;border:0}
.foot{margin-top:22px;text-align:center;color:var(--muted);font-size:12px;line-height:1.6}
.foot a{color:var(--muted)}
@media (max-width:420px){#play{width:56px;height:56px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><span></span>Впізнай пісню</h1>
    <div class="tabs">
      <button id="tabDaily" class="on">Щоденна</button>
      <button id="tabFree">Безліміт</button>
    </div>
  </header>
  <div class="langs"><div class="tabs">
    <button id="langUa" class="on">Українські</button>
    <button id="langRu">Російські</button>
    <button id="langMix">Мікс</button>
  </div></div>

  <div class="card">
    <div class="player">
      <button id="play" disabled aria-label="Відтворити">▶</button>
      <div class="bar">
        <div class="track" id="track"><div class="head" id="head"></div></div>
        <div class="meta"><span id="clipLabel">1 с</span><span id="stageLabel">Спроба 1 з 6</span></div>
      </div>
    </div>
    <div class="status" id="status">Завантаження…</div>
  </div>

  <div class="slots" id="slots"></div>

  <div id="play-area">
    <div class="guess">
      <div class="list" id="list"></div>
      <input id="q" type="text" placeholder="Назва пісні або виконавець…" autocomplete="off" spellcheck="false">
    </div>
    <div class="row">
      <button class="btn" id="skip">Пропустити (+ час)</button>
      <button class="btn primary" id="submit" disabled>Вгадати</button>
    </div>
  </div>

  <div class="scbox" id="scBox"></div>

  <div class="card result" id="result">
    <h2 id="rTitle"></h2>
    <p class="song" id="rSong"></p>
    <p id="rArtist"></p>
    <p class="streak" id="rStreak"></p>
    <p><a id="rLinkSc" href="#" target="_blank" rel="noopener">SoundCloud</a><span id="rLinkSep"> · </span><a id="rLink" href="#" target="_blank" rel="noopener">Слухати на Deezer</a></p>
    <div class="row">
      <button class="btn" id="full">▶ 30 секунд повністю</button>
      <button class="btn primary" id="share">Поділитись</button>
    </div>
    <div class="row">
      <button class="btn" id="next" style="display:none">Наступна пісня</button>
    </div>
    <p id="shareNote" style="font-size:12px;margin-top:10px"></p>
  </div>

  <div class="foot">
    <span id="count"></span> відомих пісень. Звук з SoundCloud (з початку пісні) або прев'ю з Deezer.<br>
    Потрібен інтернет. Щоденна пісня однакова для всіх у цей день.
  </div>
</div>

<script src="songs.js"></script>
<script src="songs_ru.js"></script>
<!-- SoundCloud Widget API. If it fails to load (offline, blocked), every song falls back to Deezer. -->
<script src="https://w.soundcloud.com/player/api.js"></script>
<script>
const CLIPS = [1, 2, 4, 8, 15, 30];
const MAX = CLIPS.length;

/* ---------- text matching ---------- */
const MAP2 = {shch:"щ",sh:"ш",ch:"ч",zh:"ж",kh:"х",ts:"ц",ya:"я",yu:"ю",ye:"є",yi:"ї",ie:"є",iu:"ю",ia:"я"};
const MAP1 = {a:"а",b:"б",v:"в",h:"г",g:"г",d:"д",e:"е",z:"з",y:"и",i:"і",k:"к",l:"л",m:"м",n:"н",o:"о",p:"п",r:"р",s:"с",t:"т",u:"у",f:"ф",x:"кс",w:"в",j:"й",q:"к",c:"к"};
function translit(s){
  s = s.toLowerCase(); let out = "";
  for (let i = 0; i < s.length;) {
    const t4 = s.slice(i, i+4), t2 = s.slice(i, i+2);
    if (t4 === "shch") { out += "щ"; i += 4; }
    else if (MAP2[t2]) { out += MAP2[t2]; i += 2; }
    else if (s[i] === "y" && /[aeiou]/.test(s[i-1] || "")) { out += "й"; i += 1; }
    else { out += (MAP1[s[i]] !== undefined ? MAP1[s[i]] : s[i]); i += 1; }
  }
  return out;
}
function norm(s){
  return s.toLowerCase()
    .replace(/[ʼ'’`]/g, "")
    .replace(/ґ/g, "г").replace(/и|ї/g, "і").replace(/є/g, "е").replace(/ь/g, "")
    .replace(/[^a-z0-9а-яіе ]/g, " ").replace(/\s+/g, " ").trim();
}
if (typeof SONGS_RU === "undefined") window.SONGS_RU = [];
[...SONGS, ...SONGS_RU].forEach(s => { s.key = norm(s.t + " " + s.a) + " | " + norm(s.al || "") + " | " + norm(translit(s.al || "")); });

/* language mode: "ua" (songs.js), "ru" (songs_ru.js) or "mix" (both). LIST is the active list. */
let lang = "ua", LIST = SONGS;
function listFor(l){ return l === "ru" ? SONGS_RU : l === "mix" ? SONGS.concat(SONGS_RU) : SONGS; }
// stable song identity: SONGS_RU entries may have id null
const sid = s => s ? (s.id != null ? String(s.id) : (s.sc || s.t + "|" + s.a)) : null;
function search(q){
  q = q.trim(); if (!q) return [];
  const a = norm(q), b = norm(translit(q));
  const out = [];
  for (const s of LIST) {
    if (s.key.includes(a) || s.key.includes(b)) out.push(s);
  }
  // titles starting with the query first, then alphabetical; show every match (the list scrolls),
  // so typing an artist with many songs (Скрябін has ~30) lists all of them
  out.sort((x, y) => ((norm(x.t).startsWith(a) ? 0 : 1) - (norm(y.t).startsWith(a) ? 0 : 1)) || x.t.localeCompare(y.t, "uk"));
  return out;
}

/* ---------- deezer preview (JSONP, works from a local file) ---------- */
function jsonp(url, timeout){
  return new Promise((resolve, reject) => {
    const cb = "dz_" + Math.random().toString(36).slice(2);
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timeout")); }, timeout || 9000);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = d => { cleanup(); resolve(d); };
    s.onerror = () => { cleanup(); reject(new Error("network")); };
    s.src = url + (url.includes("?") ? "&" : "?") + "output=jsonp&callback=" + cb;
    document.head.appendChild(s);
  });
}
async function getPreview(song){
  try {
    const d = await jsonp("https://api.deezer.com/track/" + song.id);
    if (d && d.preview) return d.preview;
  } catch (e) {}
  const q = encodeURIComponent('artist:"' + song.al + '" track:"' + song.t + '"');
  const d2 = await jsonp("https://api.deezer.com/search?limit=5&q=" + q);
  const hit = d2 && d2.data && d2.data.find(x => x.preview);
  if (!hit) throw new Error("no preview");
  return hit.preview;
}

/* ---------- soundcloud widget (full track, clips from the start) ---------- */
const SC_PARAMS = "&auto_play=false&hide_related=true&show_comments=false&show_reposts=false&show_teaser=false&visual=false&buying=false&sharing=false&download=false&color=%232f6fe4";
// Resolves with { widget, sound } once the track is ready and fully playable, rejects otherwise.
function scLoad(song, rid){
  return new Promise((resolve, reject) => {
    if (!window.SC || !SC.Widget) { reject(new Error("no sc api")); return; }
    const box = $("scBox"); box.innerHTML = "";
    const f = document.createElement("iframe");
    // encrypted-media is required: most official label uploads are DRM streams
    f.allow = "autoplay; encrypted-media"; f.title = "SoundCloud"; f.scrolling = "no";
    f.src = "https://w.soundcloud.com/player/?url=" + encodeURIComponent(song.sc) + SC_PARAMS;
    box.appendChild(f);
    const w = SC.Widget(f);
    const timer = setTimeout(() => reject(new Error("sc timeout")), 12000);
    w.bind(SC.Widget.Events.ERROR, () => { clearTimeout(timer); reject(new Error("sc error")); });
    w.bind(SC.Widget.Events.READY, () => {
      w.getCurrentSound(s => {
        clearTimeout(timer);
        // SNIP = only a 30s preview for non-subscribers, useless here
        if (!s || s.policy === "SNIP" || s.policy === "BLOCK" || s.streamable === false) { reject(new Error("sc not playable")); return; }
        w.bind(SC.Widget.Events.PLAY_PROGRESS, e => { if (rid === roundId) scProgress(e.currentPosition); });
        w.bind(SC.Widget.Events.PLAY, () => { if (rid === roundId) syncFullBtn(true); });
        w.bind(SC.Widget.Events.PAUSE, () => {
          if (rid !== roundId) return;
          // the muted warm-up was stopped by the widget itself before any audio: the stream probably cannot play here
          if (scSt.mode === "warm" && !scSt.warmed) scSt.suspect = true;
          syncFullBtn(false);
        });
        w.bind(SC.Widget.Events.FINISH, () => { if (rid === roundId) { if (scSt.mode === "clip") stop(); syncFullBtn(false); } });
        resolve({ widget: w, sound: s });
      });
    });
  });
}
// Widget position updates drive the clip: the clip length is measured in track time, so start latency never shortens it.
function scProgress(pos){
  const s = scSt;
  if (s.mode === "warm") {          // muted pre-buffer: as soon as audio flows, rewind and wait
    if (pos > 0) { scw.pause(); scw.seekTo(s.startMs); scw.setVolume(100); s.mode = "idle"; s.warmed = true; }
    return;
  }
  if (s.mode !== "clip") return;
  if (!s.armed) {
    // ignore stale events from before the seek, and only arm once the position actually advances
    // (a stream that fails to decode reports the start position and never moves)
    if (pos < s.fromMs - 300 || pos > s.fromMs + 600) return;
    if (s.seen === null || pos <= s.seen) { s.seen = pos; return; }
    s.armed = true; s.warmed = true;
    if ($("status").textContent === "Буферизація…") setStatus("");
  }
  s.t = (pos - s.startMs) / 1000; s.at = performance.now();
  if (s.t >= s.limit) stop();
}
function scWarm(){
  if (engine !== "sc" || done || scSt.warmed || scSt.mode !== "idle") return;
  scSt.mode = "warm"; scw.setVolume(0); scw.seekTo(scSt.startMs); scw.play();
  const rid = roundId;
  setTimeout(() => { if (rid === roundId && scSt.mode === "warm") { scw.pause(); scw.seekTo(scSt.startMs); scw.setVolume(100); scSt.mode = "idle"; } }, 6000);
}
// Any tap on the page counts as a user gesture, so pre-buffer then (often the guess box is tapped before ▶).
document.addEventListener("pointerdown", () => setTimeout(scWarm, 0), true);

/* ---------- daily pick ----------
   Stable when songs.js grows: the day is counted in Kyiv time from DAILY_EPOCH, days are grouped
   into fixed cycles of DAILY_CYCLE days, and each cycle orders ALL songs (with or without a
   SoundCloud link) with an "inside-out" Fisher-Yates shuffle keyed by position in songs.js.
   Appending a song, or adding an `sc` link to an existing one, changes at most a day or two of
   the cycle, so today's song almost never moves. Only append to songs.js: reordering or
   deleting entries reshuffles the schedule.
   Day N plays slot N of the cycle (see cycleSlots for songs without a link and for avoiding
   repeats across cycles). If today's link fails to play, `shift` moves to a spare song. */
const DAILY_EPOCH = Date.UTC(2026, 0, 1), DAILY_CYCLE = 100, DAILY_SEED = 20260101;
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function dayInfo(){
  // Calendar date in Kyiv, so the song changes at the same moment for everyone.
  let key;
  try { key = new Intl.DateTimeFormat("en-CA", { timeZone: "Europe/Kyiv", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); } catch (e) {}
  if (!/^\d{4}-\d{2}-\d{2}$/.test(key || "")) { const d = new Date(); key = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  const [y, m, dd] = key.split("-").map(Number);
  const dayIdx = Math.max(0, Math.round((Date.UTC(y, m - 1, dd) - DAILY_EPOCH) / 86400000));
  return { key, dayIdx };
}
// Only songs with a SoundCloud link are picked as answers, so every clip starts at the beginning of the song.
// Songs without one stay in SONGS for the guess search.
let PLAYABLE = SONGS.filter(s => s.sc);
function cycleOrder(cycle){
  const order = [];
  for (let k = 0; k < LIST.length; k++) {
    const j = Math.floor(rng(DAILY_SEED ^ Math.imul(cycle + 1, 0x9E3779B1) ^ Math.imul(k + 1, 0x85EBCA77))() * (k + 1));
    if (j === k) order.push(k); else { order.push(order[j]); order[j] = k; }
  }
  return order;
}
// The cycle's DAILY_CYCLE slots: slot i is order[i] if it has a SoundCloud link and was not among
// the last DAILY_GAP days of the previous cycle; otherwise the next eligible song from the rest
// of the order takes it. Positional, so a song gaining a link only changes its own slot.
const DAILY_GAP = 60; let cycleMemo = {};
function cycleSlots(cycle){
  if (cycleMemo[cycle]) return cycleMemo[cycle];
  const order = cycleOrder(cycle), n = Math.min(DAILY_CYCLE, order.length);
  const avoid = new Set(cycle > 0 ? cycleSlots(cycle - 1).slots.slice(-DAILY_GAP) : []);
  const ok = k => LIST[k].sc && !avoid.has(k);
  const slots = order.slice(0, n), spare = new Set(order.slice(n).filter(ok));
  // each open slot takes the spare song with the highest per-(cycle, slot, song) score, so adding or
  // removing one candidate only changes the slot it would win
  const score = (i, k) => rng(DAILY_SEED ^ Math.imul(cycle + 1, 0x2545F491) ^ Math.imul(i + 1, 0x68E31DA4) ^ Math.imul(k + 1, 0x1B56C4E9))();
  for (let i = 0; i < n; i++) {
    if (ok(slots[i])) continue;
    let best = -1, bs = -1;
    for (const k of spare) { const v = score(i, k); if (v > bs) { bs = v; best = k; } }
    if (best >= 0) { slots[i] = best; spare.delete(best); }
    else { const any = order.find(k => LIST[k].sc && !slots.includes(k)); if (any !== undefined) slots[i] = any; }
  }
  return (cycleMemo[cycle] = { slots, spare: [...spare] });
}
// shift: how many songs were skipped today because their SoundCloud link did not play
function dailySong(shift, dayIdx){
  if (dayIdx === undefined) dayIdx = dayInfo().dayIdx;
  const { slots, spare } = cycleSlots(Math.floor(dayIdx / DAILY_CYCLE)), pos = dayIdx % DAILY_CYCLE % slots.length;
  if (!shift) return LIST[slots[pos]];
  const list = spare.length ? spare : PLAYABLE.map(s => LIST.indexOf(s));
  return LIST[list[(pos * 7 + shift - 1) % list.length]];
}

/* ---------- state ---------- */
const $ = id => document.getElementById(id);
const audio = new Audio(); audio.preload = "auto";
let mode = "daily", target = null, previewUrl = null, guesses = [], done = false, won = false, selected = null, raf = 0, recent = [];
// engine: "sc" (SoundCloud widget) or "dz" (Deezer preview) for the current round, null while loading
let engine = null, scw = null, scSound = null, roundId = 0, scWait = 0, newFrom = 0, dailyShift = 0;
const fmtSec = x => String(x).replace(".", ",");
let scSt = { mode: "idle", startMs: 0, fromMs: 0, limit: 0, armed: false, seen: null, warmed: false, t: 0, at: 0 };

function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }
const dailyKey = () => "ua-songless-daily-" + (lang === "ua" ? "" : lang + "-") + dayInfo().key;

function setStatus(msg, err){ const s = $("status"); s.textContent = msg; s.className = "status" + (err ? " err" : ""); }
const stage = () => Math.min(guesses.length, MAX - 1);

/* ---------- render ---------- */
function renderTrack(){
  const t = $("track"); [...t.querySelectorAll(".seg")].forEach(n => n.remove());
  let prev = 0;
  CLIPS.forEach((c, i) => {
    const seg = document.createElement("div");
    seg.className = "seg" + (i <= stage() || done ? " on" : "");
    seg.style.width = "calc((100% - " + (MAX - 1) * 3 + "px) * " + ((Math.sqrt(c) - Math.sqrt(prev)) / Math.sqrt(30)) + ")";
    t.insertBefore(seg, $("head")); prev = c;
  });
  $("clipLabel").textContent = (done ? 30 : CLIPS[stage()]) + " с";
  $("stageLabel").textContent = done ? "Завершено" : "Спроба " + (guesses.length + 1) + " з " + MAX;
}
function renderSlots(){
  const box = $("slots"); box.innerHTML = "";
  for (let i = 0; i < MAX; i++) {
    const d = document.createElement("div"); d.className = "slot";
    const g = guesses[i];
    if (g) {
      if (g.skip) { d.classList.add("skip"); d.textContent = "Пропущено"; }
      else if (g.right) { d.classList.add("right"); d.textContent = "✓ " + g.label; }
      else if (g.artist) { d.classList.add("artist"); d.textContent = "≈ " + g.label; }
      else { d.classList.add("wrong"); d.textContent = "✗ " + g.label; }
    } else if (i === guesses.length && !done) d.classList.add("cur");
    box.appendChild(d);
  }
}
function renderResult(){
  $("play-area").style.display = done ? "none" : "";
  const r = $("result"); r.style.display = done ? "block" : "none";
  if (!done) { $("scBox").classList.remove("show"); return; }
  $("rTitle").textContent = won ? "Вгадано! 🎉" : "Не вийшло";
  $("rSong").textContent = target.t;
  $("rArtist").textContent = target.a;
  $("rLink").href = target.id ? "https://www.deezer.com/track/" + target.id : "#";
  const sc = engine === "sc";
  $("rLinkSc").style.display = $("rLinkSep").style.display = sc ? "" : "none";
  $("rLink").style.display = target.id ? "" : "none"; if (!target.id) $("rLinkSep").style.display = "none";
  $("rStreak").textContent = streakText();
  $("rLinkSc").href = sc ? ((scSound && scSound.permalink_url) || target.sc) : "#";
  $("rLink").textContent = sc ? "Deezer" : "Слухати на Deezer";
  $("full").textContent = sc ? "▶ Уся пісня" : "▶ 30 секунд повністю";
  $("scBox").classList.toggle("show", sc);
  $("next").style.display = mode === "free" ? "" : "none";
  $("shareNote").textContent = "";
}
function renderAll(){ renderTrack(); renderSlots(); renderResult(); $("skip").textContent = guesses.length === MAX - 1 ? "Здатися" : "Пропустити (+ час)"; }

/* ---------- playback ---------- */
function stop(){
  cancelAnimationFrame(raf); clearTimeout(scWait);
  if (engine === "sc" && scw && (scSt.mode === "clip" || scSt.mode === "full")) { scw.pause(); scSt.mode = "idle"; }
  audio.pause(); $("head").style.display = "none"; $("play").textContent = "▶";
}
// from: where the clip starts, in seconds of the clip ladder (0 = from the start, or the previous
// clip's end right after a skip or wrong guess, so only the newly unlocked part plays)
function playClip(seconds, from){
  from = from || 0;
  if (engine === "sc") { scClip(seconds, from); return; }
  if (!previewUrl) return;
  stop();
  const total = Math.sqrt(30), head = $("head"), track = $("track");
  audio.currentTime = from;
  audio.play().then(() => {
    $("play").textContent = "■"; head.style.display = "block";
    const tick = () => {
      const t = audio.currentTime;
      if (t >= seconds || audio.ended) { stop(); return; }
      head.style.left = "calc((100% - 3px) * " + (Math.sqrt(t) / total) + ")";
      raf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(() => setStatus("Браузер не дозволив відтворення. Натисни ▶ ще раз.", true));
}
function scClip(seconds, from){
  stop();
  const s = scSt, rid = roundId, total = Math.sqrt(30), head = $("head");
  s.mode = "clip"; s.limit = seconds; s.armed = false; s.seen = null; s.t = from; s.at = 0;
  s.fromMs = s.startMs + Math.round(from * 1000);
  scw.setVolume(100); scw.seekTo(s.fromMs); scw.play();
  $("play").textContent = "■";
  const busy = setTimeout(() => { if (rid === roundId && s.mode === "clip" && !s.armed) setStatus("Буферизація…"); }, 700);
  scWait = setTimeout(() => { if (rid === roundId && s.mode === "clip" && !s.armed) scFail(); }, s.suspect ? 3000 : 9000);
  const tick = () => {
    if (s.mode !== "clip") { clearTimeout(busy); return; }
    if (s.armed) {
      if (performance.now() - s.at > 5000) { scFail(); return; }   // stalled mid-clip
      // extrapolate between widget events, but never more than 250ms past the last real position
      const t = Math.min(s.t + Math.min((performance.now() - s.at) / 1000, 0.25), s.limit);
      head.style.display = "block"; head.style.left = "calc((100% - 3px) * " + (Math.sqrt(t) / total) + ")";
      if (t >= s.limit) { stop(); return; }
    }
    raf = requestAnimationFrame(tick);
  };
  tick();
}
// The SoundCloud track does not play (deleted, region block, DRM unsupported...). No Deezer preview: it starts
// mid-song. Take another song instead (daily: the next one in today's order, guesses reset).
let skipped = 0;
function scFail(){ skipSong(); }
function skipSong(){
  stop(); engine = null; scw = null; $("scBox").innerHTML = ""; $("play").disabled = true;
  if (++skipped > 5) {
    setStatus("SoundCloud не відповідає (потрібен інтернет). ", true);
    const b = document.createElement("a"); b.href = "#"; b.textContent = "Спробувати ще раз";
    b.style.color = "var(--yellow)"; b.onclick = ev => { ev.preventDefault(); skipped = 0; startRound(); };
    $("status").appendChild(b); return;
  }
  setStatus("Ця пісня зараз не грає, беремо іншу…", true);
  if (mode === "daily") { dailyShift++; guesses = []; done = false; won = false; persist(); }
  setTimeout(startRound, 900);
}
async function useDeezer(song, rid){
  const url = await getPreview(song);
  if (rid !== roundId) return;
  previewUrl = url; audio.src = url; audio.load(); engine = "dz";
  $("play").disabled = false; renderResult();
}
// Reveal: the whole track in the visible widget.
function scFull(fromStart){
  if (engine !== "sc") return;
  stop(); scSt.mode = "full"; scw.setVolume(100);
  if (fromStart) scw.seekTo(0);
  scw.play();
}
function syncFullBtn(playing){
  if (engine === "sc" && done) { $("full").textContent = playing ? "⏸ Пауза" : "▶ Уся пісня"; $("play").textContent = playing ? "■" : "▶"; }
}
function toggleFull(){ scw.isPaused(p => { if (p) scFull(false); else { scw.pause(); scSt.mode = "idle"; } }); }
// The first press after unlocking a longer clip plays only the new part; later presses play from the start.
function playNext(){ const from = newFrom; newFrom = 0; playClip(CLIPS[stage()], from); }
$("play").onclick = () => {
  if (engine === "sc") {
    if (done) toggleFull();
    else if (scSt.mode === "clip") stop(); else playNext();
    return;
  }
  if (!audio.paused) stop(); else if (done) playClip(30); else playNext();
};
$("full").onclick = () => {
  if (engine === "sc") { toggleFull(); return; }
  audio.paused ? playClip(30) : stop();
};

/* ---------- game flow ---------- */
function persist(){ if (mode === "daily") store(dailyKey(), { id: sid(target), guesses, done, won, shift: dailyShift, counted: dailyCounted }); }
// finish() always runs from a click (guess or give up), so the reveal may start playing with sound.
/* streaks, per language: daily = days in a row won, free = wins in a row */
let dailyCounted = false;
function streakText(){
  const st = store("ua-songless-streak-" + lang) || {};
  const d = st[mode] || {}; const ds = mode === "daily" ? "днів" : "перемог";
  return "Серія: " + (d.cur || 0) + " " + ds + " поспіль · Рекорд: " + (d.best || 0);
}
function bumpStreak(w){
  const key = "ua-songless-streak-" + lang, st = store(key) || {}, d = st[mode] || { cur: 0, best: 0 };
  if (mode === "daily") {
    if (dailyCounted) return; dailyCounted = true;
    const today = dayInfo().dayIdx;
    d.cur = w ? (d.last === today - 1 ? d.cur + 1 : 1) : 0; if (w) d.last = today;
  } else d.cur = w ? d.cur + 1 : 0;
  d.best = Math.max(d.best || 0, d.cur); st[mode] = d; store(key, st);
}
function finish(w){ bumpStreak(w); done = true; won = w; stop(); setStatus(""); persist(); renderAll(); if (engine === "sc") scFull(true); }
function addGuess(g){
  guesses.push(g);
  if (g.right) { finish(true); return; }
  if (guesses.length >= MAX) { finish(false); return; }
  newFrom = CLIPS[stage() - 1];
  persist(); renderAll();
  setStatus((g.artist ? "Виконавець правильний, пісня ні. " : "") + "▶ зіграє нову частину (" + fmtSec(newFrom) + "–" + fmtSec(CLIPS[stage()]) + " с), далі ▶ грає з початку.");
}
$("skip").onclick = () => { if (!done && engine) addGuess({ skip: true }); };
$("submit").onclick = submitGuess;
// Right artist, wrong song: any shared artist counts (collabs like "СТРУКТУРА ЩАСТЯ & SadSvit" match "SadSvit").
function artistParts(s){ return (s.a + " & " + (s.al || "")).split(/\s*(?:&|,|\bfeat\.?|\bft\.?|\bx\b)\s*/i).map(norm).filter(x => x.length > 1); }
function sameArtist(a, b){ const pb = artistParts(b); return artistParts(a).some(x => pb.includes(x)); }
function submitGuess(){
  if (!selected || done) return;
  const right = sid(selected) === sid(target);
  addGuess({ label: selected.t + " — " + selected.a, right, artist: !right && sameArtist(selected, target) });
  selected = null; $("q").value = ""; $("submit").disabled = true; hideList();
}

/* autocomplete */
let hi = -1, shown = [];
function hideList(){ $("list").style.display = "none"; hi = -1; }
function showList(){
  shown = search($("q").value); const l = $("list"); l.innerHTML = "";
  if (!shown.length) { hideList(); return; }
  shown.forEach((s, i) => {
    const d = document.createElement("div"); d.innerHTML = "";
    d.append(document.createTextNode(s.t));
    const sm = document.createElement("small"); sm.textContent = s.a; d.append(sm);
    d.onmousedown = e => { e.preventDefault(); pick(s); };
    l.appendChild(d);
  });
  hi = -1; l.style.display = "block";
}
function pick(s){ selected = s; $("q").value = s.t + " — " + s.a; $("submit").disabled = false; hideList(); }
$("q").addEventListener("input", () => { selected = null; $("submit").disabled = true; showList(); });
$("q").addEventListener("focus", () => { if ($("q").value) showList(); });
$("q").addEventListener("blur", () => setTimeout(hideList, 120));
$("q").addEventListener("keydown", e => {
  const items = [...$("list").children];
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!items.length) return; e.preventDefault();
    hi = (hi + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
    items.forEach((n, i) => n.classList.toggle("hi", i === hi));
  } else if (e.key === "Enter") {
    e.preventDefault();
    if (hi >= 0 && shown[hi]) pick(shown[hi]);
    else if (selected) submitGuess();
    else if (shown.length === 1) pick(shown[0]);
  } else if (e.key === "Escape") hideList();
});

/* share */
$("share").onclick = async () => {
  const sq = guesses.map(g => g.right ? "🟩" : g.skip ? "⬛" : g.artist ? "🟨" : "🟥").join("");
  const tag = lang === "ru" ? " · RU" : lang === "mix" ? " · Мікс" : "";
  const head = (mode === "daily" ? "Впізнай пісню · " + dayInfo().key : "Впізнай пісню") + tag;
  const txt = head + "\n" + (won ? guesses.length + "/" + MAX : "X/" + MAX) + " " + sq;
  let ok = false;
  try { await navigator.clipboard.writeText(txt); ok = true; } catch (e) {
    try { const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e2) {}
  }
  $("shareNote").textContent = ok ? "Скопійовано в буфер:\n" + txt : txt;
  $("shareNote").style.whiteSpace = "pre-line";
};

/* ---------- rounds ---------- */
async function startRound(){
  stop(); selected = null; $("q").value = ""; $("submit").disabled = true; hideList();
  const rid = ++roundId;
  engine = null; scw = null; scSound = null; $("scBox").innerHTML = ""; $("scBox").classList.remove("show");
  previewUrl = null; newFrom = 0; $("play").disabled = true; setStatus("Завантаження фрагмента…");
  if (!PLAYABLE.length) { target = null; setStatus("У цьому режимі ще немає пісень з SoundCloud. Спробуй інший."); return; }
  if (mode === "daily") {
    const saved = store(dailyKey());
    dailyShift = (saved && saved.shift) || 0;
    target = dailySong(dailyShift);
    // Saved guesses only count if they were for this exact song (the list may have changed since).
    const sameSong = saved && String(saved.id) === sid(target);
    dailyCounted = !!(sameSong && saved.counted);
    guesses = sameSong && saved.guesses ? saved.guesses : []; done = !!(sameSong && saved.done); won = !!(sameSong && saved.won);
  } else {
    let pool = PLAYABLE.filter(s => !recent.includes(sid(s)));
    if (!pool.length) { recent = []; pool = PLAYABLE; }
    target = pool[Math.floor(Math.random() * pool.length)];
    recent.push(sid(target)); if (recent.length > 30) recent.shift();
    guesses = []; done = false; won = false;
  }
  renderAll();
  const mine = target;
  {
    try {
      const r = await scLoad(mine, rid);
      if (rid !== roundId) return;
      skipped = 0;
      scw = r.widget; scSound = r.sound; engine = "sc";
      scSt = { mode: "idle", startMs: Math.round((mine.start || 0) * 1000), fromMs: 0, limit: 0, armed: false, seen: null, warmed: false, t: 0, at: 0 };
      $("play").disabled = false; renderResult();
      setStatus(done ? "" : "Натисни ▶ і слухай.");
      // pre-buffer now if the browser already allows sound (after any earlier tap), otherwise on the next tap
      if (navigator.userActivation && navigator.userActivation.hasBeenActive) scWarm();
      return;
    } catch (e) {
      if (rid !== roundId) return;
      console.warn("SoundCloud unavailable for", mine.t, "-", e.message);
      $("scBox").innerHTML = "";
      // a finished daily round just shows the result; otherwise take another song
      if (done) { setStatus(""); renderResult(); } else skipSong();
    }
  }
}
$("next").onclick = startRound;
function setMode(m){
  mode = m; $("tabDaily").classList.toggle("on", m === "daily"); $("tabFree").classList.toggle("on", m === "free");
  startRound();
}
function setLang(l){
  lang = l; LIST = listFor(l); PLAYABLE = LIST.filter(s => s.sc); cycleMemo = {}; recent = [];
  store("ua-songless-lang", l);
  ["Ua", "Ru", "Mix"].forEach(x => $("lang" + x).classList.toggle("on", x.toLowerCase() === l));
  $("count").textContent = LIST.length;
  startRound();
}
$("langUa").onclick = () => lang !== "ua" && setLang("ua");
$("langRu").onclick = () => lang !== "ru" && setLang("ru");
$("langMix").onclick = () => lang !== "mix" && setLang("mix");
$("tabDaily").onclick = () => mode !== "daily" && setMode("daily");
$("tabFree").onclick = () => mode !== "free" && setMode("free");
audio.addEventListener("ended", stop);

const savedLang = store("ua-songless-lang");
if (savedLang === "ru" || savedLang === "mix") setLang(savedLang); else { $("count").textContent = SONGS.length; startRound(); }
</script>
